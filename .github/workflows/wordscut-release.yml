name: WordsCut signed distribution
on:
  workflow_dispatch:
    inputs:
      version:
        description: WordsCut application version (for example 1.0.0)
        required: true
        default: '1.0.0'
        type: string
      mode:
        description: Verify the migrated release or build a new private candidate
        required: true
        default: verify-existing
        type: choice
        options: [verify-existing, build]
permissions:
  contents: read
concurrency:
  group: wordscut-distribution
  cancel-in-progress: false
jobs:
  stage:
    name: Validate signing credentials and stage private candidate
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 150
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Resolve the private release
        id: release
        env:
          VERSION: ${{ inputs.version }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(uname -m)" = arm64
          if [[ "$MODE" == build ]]; then
            tag="wordscut-candidate-v${VERSION}-${GITHUB_RUN_ID}"
          else
            test "$MODE" = verify-existing
            tag="wordscut-v${VERSION}"
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - name: Validate the transferred Developer ID and Apple API credentials
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            test -n "${!name}" || { echo "Missing credential: $name"; exit 1; }
          done
          KC="$RUNNER_TEMP/wordscut-release.keychain-db"
          printf 'KEYCHAIN_PATH=%s\n' "$KC" >> "$GITHUB_ENV"
          security list-keychains -d user > "$RUNNER_TEMP/original-keychains.txt"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k "$KC" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(tr -d '"' < "$RUNNER_TEMP/original-keychains.txt")
          security find-identity -v -p codesigning "$KC" | grep -F "$APPLE_SIGNING_IDENTITY"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool history --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --output-format json > "$RUNNER_TEMP/notary-preflight.json"
          echo 'Existing signing identity and Apple notarization credentials validated.'
      - name: Download the private source snapshot
        if: inputs.mode == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          input="wordscut-input-v${VERSION}"
          gh release view "$input" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -Fx true
          mkdir -p "$RUNNER_TEMP/wordscut-input" "$RUNNER_TEMP/wordscut-source"
          gh release download "$input" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/wordscut-input" --pattern WordsCut-source.tar.gz --pattern provenance.json --pattern SHA256SUMS.txt
          (cd "$RUNNER_TEMP/wordscut-input" && shasum -a 256 -c SHA256SUMS.txt)
          tar -xzf "$RUNNER_TEMP/wordscut-input/WordsCut-source.tar.gz" -C "$RUNNER_TEMP/wordscut-source"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: inputs.mode == 'build'
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        if: inputs.mode == 'build'
      - name: Test, build, sign, notarize and verify
        if: inputs.mode == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          export WORDSCUT_SOURCE_ARCHIVE="$RUNNER_TEMP/wordscut-input/WordsCut-source.tar.gz"
          export WORDSCUT_PROVENANCE="$RUNNER_TEMP/wordscut-input/provenance.json"
          # Keep compiler/test diagnostics containing private source out of public Actions logs.
          if ! bash distribution/wordscut/build.sh "$RUNNER_TEMP/wordscut-source" "$RUNNER_TEMP/release-assets" "$VERSION" > "$RUNNER_TEMP/private-build.log" 2>&1; then
            gh release create "wordscut-build-log-${GITHUB_RUN_ID}" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title 'WordsCut private build diagnostics' --notes 'Maintainer-only diagnostics. Keep draft.' "$RUNNER_TEMP/private-build.log"
            echo 'Build failed. Detailed diagnostics are in the private draft build-log release.'
            exit 1
          fi
          echo 'Build, tests, signing, notarization and local verification passed.'
      - name: Store the verified candidate privately
        if: inputs.mode == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "WordsCut candidate $TAG" --notes 'Private paid-delivery candidate. Never publish this GitHub release: it contains the installer and application source. Verify the downloaded files, then upload the customer package to the paid store.' "$RUNNER_TEMP/release-assets/"*
      - name: Remove signing material
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/original-keychains.txt" ]; then
            security list-keychains -d user -s $(tr -d '"' < "$RUNNER_TEMP/original-keychains.txt")
          fi
          if [ -n "${KEYCHAIN_PATH:-}" ]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/notary-preflight.json" "$RUNNER_TEMP/original-keychains.txt"
  verify:
    name: Verify the actual staged download
    needs: stage
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download only from a private draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.stage.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -Fx true
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/staged-download"
      - name: Verify signatures, notarization, Gatekeeper, source and checksums
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bash distribution/wordscut/verify.sh "$RUNNER_TEMP/staged-download" "$VERSION" 2>&1 | tee "$RUNNER_TEMP/signed-release-verification.txt"
      - name: Save the verification record privately
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.stage.outputs.tag }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$RUNNER_TEMP/signed-release-verification.txt"
